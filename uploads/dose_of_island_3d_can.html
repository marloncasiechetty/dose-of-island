  // ---- Ground shadow catcher ----
  var groundGeo = new THREE.PlaneGeometry(20, 20);
  var groundMat = new THREE.ShadowMaterial({ opacity: 0.22 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1.62;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---- Can group ----
  var canGroup = new THREE.Group();
  scene.add(canGroup);

  var R = 0.62;          // can radius
  var BODY_H = 2.55;     // straight body height (label area)
  var TOP_TAPER_H = 0.28;
  var TOP_LID_H = 0.16;
  var BOT_TAPER_H = 0.18;
  var BOT_H = 0.10;

  var metalMat = new THREE.MeshStandardMaterial({
    color: 0xfbfaf7, metalness: 0.35, roughness: 0.32
  });

  // Body (label surface) - cylindrical UVs map perfectly for a flat wrap label
  var bodyGeo = new THREE.CylinderGeometry(R, R, BODY_H, 96, 4, true);
  var loader = new THREE.TextureLoader();

  var bodyY = TOP_TAPER_H/2 + BODY_H/2 - 0.02;

  loader.load(LABEL_DATA_URI, function(tex){
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    // Offset so the front logo panel faces the camera at rest.
    tex.offset.x = 0.25;

    var bodyMat = new THREE.MeshStandardMaterial({
      map: tex, metalness: 0.05, roughness: 0.55, side: THREE.DoubleSide
    });

    var body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = bodyY;
    body.castShadow = true;
    body.receiveShadow = true;
    canGroup.add(body);

    loadingEl.style.display = 'none';
    hintEl.style.display = 'block';
  });

  // Top taper (neck) into the lid
  var topTaperGeo = new THREE.CylinderGeometry(R*0.86, R, TOP_TAPER_H, 96);
  var topTaper = new THREE.Mesh(topTaperGeo, metalMat);
  topTaper.position.y = bodyY + BODY_H/2 + TOP_TAPER_H/2 - 0.02;
  topTaper.castShadow = true;
  canGroup.add(topTaper);

  // Top lid
  var lidGeo = new THREE.CylinderGeometry(R*0.86, R*0.86, TOP_LID_H, 96);
  var lid = new THREE.Mesh(lidGeo, metalMat);
  lid.position.y = topTaper.position.y + TOP_TAPER_H/2 + TOP_LID_H/2 - 0.01;
  lid.castShadow = true;
  canGroup.add(lid);

  // Rim detail ring on lid edge
  var rimGeo = new THREE.TorusGeometry(R*0.86, 0.018, 12, 96);
  var rimRing = new THREE.Mesh(rimGeo, metalMat);
  rimRing.rotation.x = Math.PI/2;
  rimRing.position.y = lid.position.y + TOP_LID_H/2;
  canGroup.add(rimRing);

  // Pull-tab suggestion (simple)
  var tabMat = new THREE.MeshStandardMaterial({ color:0xd7d9db, metalness:0.9, roughness:0.25 });
  var tabGeo = new THREE.TorusGeometry(0.11, 0.028, 10, 24);
  var tab = new THREE.Mesh(tabGeo, tabMat);
  tab.rotation.x = Math.PI/2;
  tab.position.set(0, lid.position.y + TOP_LID_H/2 + 0.02, 0.12);
  canGroup.add(tab);

  // Bottom taper
  var botTaperGeo = new THREE.CylinderGeometry(R, R*0.90, BOT_TAPER_H, 96);
  var botTaper = new THREE.Mesh(botTaperGeo, metalMat);
  botTaper.position.y = bodyY - BODY_H/2 - BOT_TAPER_H/2 + 0.02;
  botTaper.castShadow = true;
  canGroup.add(botTaper);

  // Bottom cap
  var botGeo = new THREE.CylinderGeometry(R*0.90, R*0.90, BOT_H, 96);
  var bot = new THREE.Mesh(botGeo, metalMat);
  bot.position.y = botTaper.position.y - BOT_TAPER_H/2 - BOT_H/2 + 0.01;
  bot.castShadow = true;
  canGroup.add(bot);

  canGroup.position.y = -0.15;

  // ---- Interaction: drag to rotate, scroll to zoom, gentle idle spin ----
  var isDragging = false;
  var prevX = 0, prevY = 0;
  var rotY = 0.4, rotX = 0;
  var velY = 0.0025;
  var userInteracted = false;

  function onDown(x,y){ isDragging = true; prevX = x; prevY = y; userInteracted = true; }
  function onMove(x,y){
    if(!isDragging) return;
    var dx = x - prevX, dy = y - prevY;
    rotY += dx * 0.006;
    rotX += dy * 0.004;
    rotX = Math.max(-0.35, Math.min(0.35, rotX));
    prevX = x; prevY = y;
  }
  function onUp(){ isDragging = false; }

  renderer.domElement.addEventListener('mousedown', function(e){ onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function(e){ onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', onUp);

  renderer.domElement.addEventListener('touchstart', function(e){
    var t = e.touches[0]; onDown(t.clientX, t.clientY);
  }, {passive:true});
  renderer.domElement.addEventListener('touchmove', function(e){
    var t = e.touches[0]; onMove(t.clientX, t.clientY);
  }, {passive:true});
  renderer.domElement.addEventListener('touchend', onUp);

  renderer.domElement.addEventListener('wheel', function(e){
    e.preventDefault();
    camera.position.z += e.deltaY * 0.0018;
    camera.position.z = Math.max(3.6, Math.min(9, camera.position.z));
  }, {passive:false});

  window.addEventListener('resize', function(){
    camera.aspect = app.clientWidth/app.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(app.clientWidth, app.clientHeight);
  });

  function animate(){
    requestAnimationFrame(animate);
    if(!isDragging){
      rotY += userInteracted ? velY*0.15 : velY;
    }
    canGroup.rotation.y = rotY;
    canGroup.rotation.x = rotX;
    renderer.render(scene, camera);
  }
  animate();

})();
</script>
</body>
</html>
